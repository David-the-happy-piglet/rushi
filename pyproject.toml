[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rushi"
version = "0.1.0"
description = "如是 — timelined persona memory graph, style imitation and what-would-ta-do simulation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rushi = "rushi.cli:main"

[tool.setuptools]
packages = ["rushi", "rushi.ingest"]
include-package-data = true

[tool.setuptools.package-data]
rushi = ["../prompts/*.md"]
